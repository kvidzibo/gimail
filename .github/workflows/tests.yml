name: Tests

on:
  push:
    branches-ignore: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.8'
          enable-cache: false
      - name: Install project into a local environment with uv
        run: uv sync --locked --python python
      - name: Test CLI, terminal picker, and local IMAP protocol
        run: xvfb-run -a uv run --locked python -W error -m unittest discover -v
      - name: Test isolated uv tool installs from wheel, sdist, and Git
        run: xvfb-run -a uv run --locked python -W error -m tests.package_smoke --git-ref HEAD
