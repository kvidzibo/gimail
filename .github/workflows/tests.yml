name: Tests

on:
  push:
    branches-ignore: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create a dependency-free local environment
        run: python -m venv --without-pip .venv
      - name: Test CLI and local IMAP protocol
        run: .venv/bin/python -W error -m unittest discover -v
